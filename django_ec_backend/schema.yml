        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
  /api/create-checkout-session/:
    post:
      operationId: create_checkout_session_create
      description: ログインユーザーのカート情報をもとに、Stripeのチェックアウトセッションを作成し、セッションIDと決済URLを返します。
      tags:
      - create-checkout-session
      security:
      - CookieJWTAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: StripeのチェックアウトセッションID
                  url:
                    type: string
                    description: Next.jsがリダイレクトするためのStripe決済ページのURL
          description: ''
  /api/orders/:
    get:
      operationId: orders_list
      tags:
      - orders
      security:
      - CookieJWTAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
          description: ''
  /api/orders/{id}/:
    get:
      operationId: orders_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this order.
        required: true
      tags:
      - orders
      security:
      - CookieJWTAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/products/:
    get:
      operationId: products_list
      tags:
      - products
      security:
      - CookieJWTAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
          description: ''
  /api/products/{id}/:
    get:
      operationId: products_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      tags:
      - products
      security:
      - CookieJWTAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/products/compare/:
    get:
      operationId: products_compare_list
      tags:
      - products
      security:
      - CookieJWTAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
          description: ''
  /api/webhook/stripe/:
    post:
      operationId: webhook_stripe_create
      description: Stripeからの支払い完了イベント等の通知（Webhook）を受け取り、注文ステータスを更新します。
      tags:
      - webhook
      security:
      - CookieJWTAuth: []
      - {}
      responses:
        '200':
          description: No response body
components:
  schemas:
    Brand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: メーカー（ブランド）
          maxLength: 100
      required:
      - id
      - name
    Cart:
      type: object
      properties:
